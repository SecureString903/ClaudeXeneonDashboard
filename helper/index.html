<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage</title>
<meta name="x-icue-property" content="helperPort" data-label="Helper port" data-type="textfield" data-default="8787">
<style>
  :root {
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --surface-3:      #2a2a28;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --hairline:       rgba(255,255,255,0.10);

    --accent:         #3987e5;  /* normal fill */
    --accent-track:   #0d366b;
    --warning:        #fab219;
    --warning-track:  #4a3505;
    --critical:       #d03b3b;
    --critical-track: #431414;
    --good-text:      #0ca30c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- overall stage: rings (left) + side panel (right) ---------- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: row;
    gap: 2.2vh;
    padding: 3.2vh 3.2vh 1.2vh;
    min-height: 0;
    min-width: 0;
  }

  .rings {
    flex: 1.7;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 2.2vh;
    min-width: 0;
    min-height: 0;
  }

  /* ---------- ring gauge card ---------- */
  .ringCard {
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 1.8vh;
    padding: 2vh 2vh 2.2vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .ringWrap {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ringWrap svg {
    width: min(100%, 100%);
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1;
  }
  .ringWrap svg circle {
    stroke: var(--accent-track);
  }
  .ringWrap svg circle.value {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;
  }
  .ringCenter {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  .ringPct {
    font-weight: 600;
    font-size: clamp(20px, min(9vh, 11vw), 74px);
    line-height: 1;
  }
  .ringPct .sign { font-size: 0.5em; font-weight: 500; color: var(--text-secondary); }
  .ringWord {
    margin-top: 0.4em;
    font-size: clamp(9px, min(2.2vh, 2.6vw), 17px);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .ringLabel {
    margin-top: 1.4vh;
    font-size: clamp(11px, min(3vh, 3.4vw), 22px);
    color: var(--text-secondary);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .ringReset {
    margin-top: 0.4vh;
    display: flex;
    gap: 0.6em;
    font-size: clamp(9px, min(2.2vh, 2.6vw), 16px);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
  }
  .ringReset .in { color: var(--text-primary); }
  .ringReset .at { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }

  /* time-elapsed pace bar: how far into the window we are, vs. how much is used */
  .ringPace { width: 100%; margin-top: 1vh; }
  .ringPace .bar {
    height: clamp(3px, 0.5vh, 5px);
    border-radius: 2px;
    background: var(--surface-3);
    overflow: hidden;
  }
  .ringPace .bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--text-secondary);
    border-radius: 2px;
    transition: width 0.6s ease;
  }
  .ringPace .lbl {
    margin-top: 0.4vh;
    font-size: clamp(8px, min(1.8vh, 2vw), 13px);
    color: var(--text-muted);
    text-align: center;
    white-space: nowrap;
  }

  /* ---------- side panel ---------- */
  .panel {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 1.8vh;
    padding: 2.2vh 2.4vh;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .panelHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1vh;
    padding-bottom: 1.6vh;
    margin-bottom: 1.4vh;
    border-bottom: 1px solid var(--hairline);
    flex: none;
  }
  .planPill {
    font-size: clamp(10px, min(2.6vh, 3vw), 19px);
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panelHead .sub {
    font-size: clamp(9px, min(2vh, 2.2vw), 14px);
    color: var(--text-muted);
    white-space: nowrap;
  }
  /* Grid of stat tiles - stretches to fill the panel however many tiles
     there are, so 1 tile looks as intentional as 6. */
  .panelRows {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    grid-auto-rows: 1fr;
    gap: 1vh;
    min-height: 0;
    overflow: hidden;
  }
  .panelEmpty {
    grid-column: 1 / -1;
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: clamp(10px, min(2.4vh, 2.8vw), 16px);
  }
  /* container-type: size makes the cqh/cqw units below relative to each
     tile's OWN box, not the viewport - so text scales down correctly when
     the grid wraps to more rows (5 tiles = 3 short rows) instead of
     overflowing past the tile's edges the way vh-based sizing would. */
  .tile {
    container-type: size;
    background: var(--surface-3);
    border: 1px solid var(--hairline);
    border-radius: 1.4vh;
    padding: 1.2vh 1.6vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .tile .tileTop {
    display: flex;
    align-items: center;
    gap: 0.7vh;
    min-width: 0;
    flex: none;
  }
  .tile .dot {
    width: 0.9vh; height: 0.9vh;
    min-width: 6px; min-height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .tile .tileLabel {
    font-size: clamp(9px, 15cqh, 17px);
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .tileValue {
    font-weight: 600;
    font-size: clamp(16px, 34cqh, 50px);
    line-height: 1.05;
    margin: 0.4cqh 0;
  }
  .tile .tileValue .unit { font-size: 0.5em; font-weight: 500; color: var(--text-secondary); }
  .tile .tileMeter {
    height: clamp(4px, 8cqh, 8px);
    border-radius: 3px;
    background: var(--accent-track);
    overflow: hidden;
    flex: none;
  }
  .tile .tileMeter i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
    transition: width 0.6s ease, background 0.3s ease;
  }
  .tile .tileSub {
    margin-top: 0.5cqh;
    font-size: clamp(8px, 12cqh, 14px);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: none;
  }
  /* Stat tiles (tokens/cost/burn rate/projection) show a value string rather
     than a 0-100% meter, and the strings run longer ("$0.36", "6.42M") so we
     cap the font a bit smaller than the plain percentage tiles. */
  .tile.noMeter .tileMeter { display: none; }
  .tile.noMeter .tileValue {
    font-size: clamp(13px, 26cqh, 36px);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1vh;
    padding: 0 3.4vh 1.6vh;
    font-size: clamp(9px, min(2.4vh, 2.8vw), 18px);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .footer .conn { display: inline-flex; align-items: center; gap: 0.55em; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .footer .conn .dot { width: 0.65em; height: 0.65em; border-radius: 50%; background: var(--good-text); flex: none; }
  .footer .conn.bad .dot { background: var(--critical); }

  /* Full-screen message states (helper offline, errors) */
  .message {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.6vh;
    padding: 4vh 6vw;
  }
  .message h1 { font-size: clamp(16px, 6vh, 44px); font-weight: 600; }
  .message p  { font-size: clamp(11px, 3.2vh, 24px); color: var(--text-secondary); max-width: 60ch; }
  .message code {
    font-family: Consolas, monospace;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 0.15em 0.5em;
    color: var(--text-secondary);
  }
  body.showMessage .stage, body.showMessage .footer { display: none; }
  body.showMessage .message { display: flex; }

  /* Narrow/tall slots: stack rings above the panel, rings side-by-side */
  @media (max-aspect-ratio: 5/4) {
    .stage { flex-direction: column; }
    .rings { flex: none; height: 52%; }
    .panel { flex: 1; }
  }
  /* Very narrow (vertical Edge slot): stack the two rings too */
  @media (max-aspect-ratio: 2/3) {
    .rings { grid-auto-flow: row; grid-auto-columns: unset; grid-auto-rows: 1fr; height: 62%; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="rings" id="rings"></div>
    <div class="panel" id="panel">
      <div class="panelHead">
        <span class="planPill" id="planPill">Claude</span>
        <span class="sub" id="panelSub">other limits</span>
      </div>
      <div class="panelRows" id="panelRows"></div>
    </div>
  </div>
  <div class="footer">
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">Connecting…</span></span>
    <span id="updated"></span>
  </div>
  <div class="message" id="message"></div>

<script>
(function () {
  'use strict';

  // ---------- config ----------
  function getPort() {
    try {
      var q = new URLSearchParams(location.search).get('port');
      if (q) return q;
    } catch (e) {}
    if (typeof helperPort !== 'undefined' && helperPort) return String(helperPort); // iCUE property
    return '8787';
  }
  function usageUrl() {
    // When served by the helper itself (iFrame mode / browser), stay same-origin.
    if (location.protocol === 'http:' || location.protocol === 'https:') return '/usage';
    return 'http://127.0.0.1:' + getPort() + '/usage';
  }

  var POLL_MS = 60000;
  var LABELS = {
    five_hour:            'Current session · 5 hr',
    seven_day:            'Weekly · all models',
    seven_day_opus:       'Weekly · Opus',
    seven_day_sonnet:     'Weekly · Sonnet',
    seven_day_oauth_apps: 'Weekly · connected apps',
    extra_credit:         'Extra credit',
    extra_usage:          'Extra usage'
  };
  var ORDER = ['five_hour', 'seven_day', 'seven_day_opus', 'seven_day_sonnet', 'seven_day_oauth_apps', 'extra_credit', 'extra_usage'];
  // The two headline limits get the big ring gauges; everything else (that's
  // recognized, or clearly an "extra" bucket) is listed compactly in the panel.
  var RING_KEYS = ['five_hour', 'seven_day'];
  // Window lengths for the "time elapsed" pace bar under each ring.
  var WIN_MS = { five_hour: 5 * 3600 * 1000, seven_day: 7 * 24 * 3600 * 1000 };
  // Only show recognized panels; unrecognized internal buckets (codename fields
  // Anthropic hasn't announced) are hidden. Extra-credit-style keys always pass.
  function isUseful(key) {
    return Object.prototype.hasOwnProperty.call(LABELS, key) || /extra/i.test(key);
  }

  var state = { data: null, fetchedLocal: 0, offline: false, lastError: null };

  // ---------- helpers ----------
  function prettyLabel(key) {
    if (LABELS[key]) return LABELS[key];
    return key.replace(/^seven_day_?/, 'Weekly · ').replace(/_/g, ' ')
              .replace(/^\s*·\s*$/, 'Weekly') || key;
  }
  function severity(pct) {
    if (pct >= 90) return { name: 'critical', fill: 'var(--critical)', track: 'var(--critical-track)', word: 'Nearly used up' };
    if (pct >= 70) return { name: 'warning',  fill: 'var(--warning)',  track: 'var(--warning-track)',  word: 'Running high' };
    return { name: 'ok', fill: 'var(--accent)', track: 'var(--accent-track)', word: 'Available' };
  }
  function fmtCountdown(ms) {
    if (ms <= 0) return 'now';
    var m = Math.floor(ms / 60000);
    var d = Math.floor(m / 1440);
    var h = Math.floor((m % 1440) / 60);
    var mm = m % 60;
    if (d > 0) return d + 'd ' + h + 'h';
    if (h > 0) return h + 'h ' + (mm < 10 ? '0' : '') + mm + 'm';
    return mm + 'm';
  }
  function fmtTokens(n) {
    if (n == null || !isFinite(n)) return '—';
    var v = Math.abs(n);
    var sign = n < 0 ? '-' : '';
    if (v >= 1e6) return sign + (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return sign + (v / 1e3).toFixed(1) + 'K';
    return sign + String(Math.round(v));
  }
  function fmtCost(n) {
    if (n == null || !isFinite(n)) return '—';
    var v = Math.abs(n);
    var sign = n < 0 ? '-' : '';
    var s = v < 1 ? v.toFixed(3) : v < 100 ? v.toFixed(2) : v.toFixed(0);
    return sign + '$' + s;
  }
  function fmtClock(dt) {
    try {
      var opts = { hour: 'numeric', minute: '2-digit' };
      var now = new Date();
      if (dt.toDateString() !== now.toDateString()) opts.weekday = 'short';
      return dt.toLocaleString([], opts);
    } catch (e) { return ''; }
  }
  function limitsFrom(data) {
    var out = [];
    var seen = {};
    ORDER.forEach(function (k) {
      if (data[k] && typeof data[k] === 'object' && 'utilization' in data[k]) { out.push([k, data[k]]); seen[k] = 1; }
    });
    Object.keys(data).forEach(function (k) {
      var v = data[k];
      if (!seen[k] && v && typeof v === 'object' && 'utilization' in v && isUseful(k)) out.push([k, v]);
    });
    return out;
  }

  // ---------- ring gauge geometry ----------
  var RING_R = 58, RING_CIRC = 2 * Math.PI * RING_R;

  // ---------- rendering ----------
  var ringsEl = document.getElementById('rings');
  var panelRowsEl = document.getElementById('panelRows');
  var planPillEl = document.getElementById('planPill');
  var msgEl = document.getElementById('message');
  var connEl = document.getElementById('conn');
  var connTextEl = document.getElementById('connText');
  var updatedEl = document.getElementById('updated');
  var ringEls = {};
  var rowEls = {};

  function showMessage(title, bodyHtml) {
    msgEl.innerHTML = '<h1>' + title + '</h1>' + bodyHtml;
    document.body.classList.add('showMessage');
  }
  function hideMessage() { document.body.classList.remove('showMessage'); }

  function buildRing(key) {
    var el = document.createElement('div');
    el.className = 'ringCard';
    el.innerHTML =
      '<div class="ringWrap">' +
        '<svg viewBox="0 0 140 140">' +
          '<circle class="track" cx="70" cy="70" r="' + RING_R + '" fill="none" stroke-width="12"/>' +
          '<circle class="value" cx="70" cy="70" r="' + RING_R + '" fill="none" stroke-width="12" ' +
            'stroke-dasharray="' + RING_CIRC.toFixed(1) + '" transform="rotate(-90 70 70)"/>' +
        '</svg>' +
        '<div class="ringCenter"><span class="ringPct"><span class="num"></span><span class="sign">%</span></span>' +
        '<span class="ringWord"></span></div>' +
      '</div>' +
      '<div class="ringLabel"></div>' +
      '<div class="ringReset"><span class="in"></span><span class="at"></span></div>' +
      '<div class="ringPace"><div class="bar"><i></i></div><div class="lbl"></div></div>';
    ringsEl.appendChild(el);
    ringEls[key] = el;
    return el;
  }

  function buildTile(key) {
    var el = document.createElement('div');
    el.className = 'tile';
    el.innerHTML =
      '<div class="tileTop"><span class="dot"></span><span class="tileLabel"></span></div>' +
      '<div><div class="tileValue"><span class="num"></span><span class="unit">%</span></div>' +
      '<div class="tileMeter"><i></i></div></div>' +
      '<div class="tileSub"></div>';
    panelRowsEl.appendChild(el);
    rowEls[key] = el;
    return el;
  }

  function fillReset(inEl, atEl, lim, now) {
    if (lim.resets_at) {
      var t = new Date(lim.resets_at);
      if (!isNaN(t)) {
        inEl.textContent = 'Resets in ' + fmtCountdown(t - now);
        atEl.textContent = fmtClock(t);
        return;
      }
    }
    inEl.textContent = ''; atEl.textContent = '';
  }

  // How far into the current window we are (0-1), for the pace bar. Needs a
  // known window length (5-hour / weekly) and a resets_at to anchor the start.
  function fillPace(el, key, lim, now) {
    var windowMs = WIN_MS[key];
    if (!windowMs || !lim.resets_at) { el.style.display = 'none'; return; }
    var end = new Date(lim.resets_at).getTime();
    if (isNaN(end)) { el.style.display = 'none'; return; }
    var start = end - windowMs;
    var frac = Math.max(0, Math.min(1, (now - start) / windowMs));
    el.style.display = '';
    el.querySelector('.bar i').style.width = (frac * 100).toFixed(1) + '%';
    el.querySelector('.lbl').textContent = Math.round(frac * 100) + '% of window elapsed';
  }

  // ---------- local token/cost stat tiles (from the helper's log scan) ----------
  // Only built from fields the helper actually returned, so a helper without
  // this feature (or one that found no local logs) just yields an empty list.
  function buildStatDefs(local) {
    var defs = [];
    if (!local) return defs;
    if (local.tokensSession != null) {
      defs.push(['stat_tokens', {
        label: 'Tokens · session',
        value: fmtTokens(local.tokensSession),
        sub: local.tokensWeek != null ? ('week ' + fmtTokens(local.tokensWeek)) : ''
      }]);
    }
    if (local.costSession != null) {
      defs.push(['stat_cost', {
        label: 'Est. cost · session',
        value: fmtCost(local.costSession),
        sub: local.costWeek != null ? ('week ' + fmtCost(local.costWeek) + ' · API-rate est.') : 'API-rate est.'
      }]);
    }
    if (local.tokensPerMin != null) {
      defs.push(['stat_burn', {
        label: 'Burn rate',
        value: fmtTokens(local.tokensPerMin) + '/m',
        sub: local.costPerHour != null ? (fmtCost(local.costPerHour) + '/hr') : ''
      }]);
    }
    if (local.blockProjectedTokens != null) {
      defs.push(['stat_block', {
        label: 'Session projection',
        value: fmtTokens(local.blockProjectedTokens),
        sub: local.blockProjectedCost != null ? ('≈ ' + fmtCost(local.blockProjectedCost) + ' by reset') : 'by reset'
      }]);
    }
    return defs;
  }
  function renderStatTile(el, def) {
    el.classList.add('noMeter');
    el.querySelector('.dot').style.background = 'var(--accent)';
    el.querySelector('.tileLabel').textContent = def.label;
    el.querySelector('.tileValue .num').textContent = def.value;
    el.querySelector('.tileValue .unit').textContent = '';
    el.querySelector('.tileSub').textContent = def.sub || '';
  }

  function render() {
    var data = state.data;
    if (state.offline) {
      showMessage('Can’t reach the usage helper',
        '<p>The little background server that reads your Claude usage isn’t responding.</p>' +
        '<p>Run <code>install.bat</code> from the ClaudeUsageWidget folder, or start it manually with ' +
        '<code>ClaudeUsageServer.ps1</code>, then this widget will reconnect on its own.</p>');
      setConn(false, 'Helper offline');
      return;
    }
    if (!data) return;
    if (data.ok === false) {
      showMessage('Can’t fetch Claude usage',
        '<p>' + (data.error || 'Could not fetch usage.') + '</p>');
      setConn(false, 'Error');
      return;
    }
    hideMessage();
    var planText = data.subscription ? ('Claude ' + String(data.subscription).replace(/^./, function(c){return c.toUpperCase();})) : 'Claude';
    setConn(true, planText);
    planPillEl.textContent = planText;

    var limits = limitsFrom(data);
    var ringKeys = limits.filter(function (p) { return RING_KEYS.indexOf(p[0]) !== -1; });
    var rowKeys = limits.filter(function (p) { return RING_KEYS.indexOf(p[0]) === -1; });
    var statDefs = buildStatDefs(data.local);
    var panelKeys = rowKeys.map(function (p) { return p[0]; }).concat(statDefs.map(function (d) { return d[0]; }));

    // Remove stale ring/tile elements
    Object.keys(ringEls).forEach(function (k) {
      if (!ringKeys.some(function (p) { return p[0] === k; })) { ringEls[k].remove(); delete ringEls[k]; }
    });
    Object.keys(rowEls).forEach(function (k) {
      if (panelKeys.indexOf(k) === -1) { rowEls[k].remove(); delete rowEls[k]; }
    });

    var now = Date.now();

    // ---- big rings ----
    ringKeys.forEach(function (pair) {
      var key = pair[0], lim = pair[1];
      var el = ringEls[key] || buildRing(key);
      var pct = Number(lim.utilization);
      if (!isFinite(pct)) pct = 0;
      pct = Math.max(0, Math.min(100, pct));
      var sev = severity(pct);
      var offset = RING_CIRC * (1 - pct / 100);

      el.querySelector('circle.value').style.strokeDashoffset = offset.toFixed(1);
      el.querySelector('circle.value').style.stroke = sev.fill;
      el.querySelector('circle.track').style.stroke = sev.track;
      el.querySelector('.ringPct .num').textContent = (pct >= 10 || pct === 0) ? Math.round(pct) : pct.toFixed(1);
      el.querySelector('.ringWord').textContent = sev.word;
      el.querySelector('.ringLabel').textContent = prettyLabel(key);
      fillReset(el.querySelector('.ringReset .in'), el.querySelector('.ringReset .at'), lim, now);
      fillPace(el.querySelector('.ringPace'), key, lim, now);
    });

    // ---- side panel: grid of stat tiles (remaining limits + local token/cost stats) ----
    if (panelKeys.length === 0) {
      if (!panelRowsEl.querySelector('.panelEmpty')) {
        panelRowsEl.innerHTML = '<div class="panelEmpty">Nothing else to show</div>';
      }
    } else {
      var empty = panelRowsEl.querySelector('.panelEmpty');
      if (empty) empty.remove();
      rowKeys.forEach(function (pair) {
        var key = pair[0], lim = pair[1];
        var el = rowEls[key] || buildTile(key);
        el.classList.remove('noMeter');
        var pct = Number(lim.utilization);
        if (!isFinite(pct)) pct = 0;
        pct = Math.max(0, Math.min(100, pct));
        var sev = severity(pct);

        el.querySelector('.dot').style.background = sev.fill;
        el.querySelector('.tileLabel').textContent = prettyLabel(key);
        el.querySelector('.tileValue .num').textContent = (pct >= 10 || pct === 0) ? Math.round(pct) : pct.toFixed(1);
        el.querySelector('.tileValue .unit').textContent = '%';
        var fill = el.querySelector('.tileMeter i');
        fill.style.width = pct + '%';
        fill.style.background = sev.fill;
        el.querySelector('.tileMeter').style.background = sev.track;

        var subEl = el.querySelector('.tileSub');
        if (lim.resets_at) {
          var t = new Date(lim.resets_at);
          subEl.textContent = !isNaN(t) ? 'Resets in ' + fmtCountdown(t - now) : '';
        } else {
          subEl.textContent = '';
        }
      });
      statDefs.forEach(function (pair) {
        var key = pair[0], def = pair[1];
        var el = rowEls[key] || buildTile(key);
        renderStatTile(el, def);
      });
    }

    if (state.fetchedLocal) {
      var ago = Math.max(0, Math.round((now - state.fetchedLocal) / 60000));
      updatedEl.textContent = ago === 0 ? 'Updated just now' : 'Updated ' + ago + ' min ago';
    }
  }

  function setConn(ok, text) {
    connEl.className = 'conn' + (ok ? '' : ' bad');
    connTextEl.textContent = text;
  }

  // ---------- data loop ----------
  function poll() {
    fetch(usageUrl(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        state.data = json;
        state.offline = false;
        state.fetchedLocal = Date.now();
        render();
      })
      .catch(function (err) {
        state.offline = true;
        state.lastError = String(err);
        render();
      });
  }

  poll();
  setInterval(poll, POLL_MS);
  setInterval(render, 30000); // keep countdowns fresh between polls

  // iCUE lifecycle (safe no-ops outside iCUE)
  window.icueEvents = {
    onICUEInitialized: function () { poll(); },
    onDataUpdated: function () { render(); }
  };
})();
</script>
</body>
</html>
